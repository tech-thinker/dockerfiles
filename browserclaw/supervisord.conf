[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stopwaitsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:vnc]
command=/usr/bin/tigervncserver :1 -fg -localhost no -rfbport 5901 -geometry 1280x800 -depth 24 -SecurityTypes VncAuth -PasswordFile /home/desktop/.config/tigervnc/passwd -xstartup /usr/bin/startxfce4
directory=/home/desktop
user=desktop
environment=HOME="/home/desktop",USER="desktop",DISPLAY=":1"
autostart=true
autorestart=true
priority=30
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:browserclaw]
command=/usr/local/bin/start-browserclaw.sh
directory=/home/desktop
user=desktop
environment=HOME="/home/desktop",USER="desktop",DISPLAY=":1",XAUTHORITY="/home/desktop/.Xauthority"
autostart=true
autorestart=true
priority=20
startsecs=5
startretries=3
stopwaitsecs=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
